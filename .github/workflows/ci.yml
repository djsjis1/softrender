name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        build_type: [Release]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configure CMake
        # 基准目标默认关闭，CI 显式打开：它只链接 render/core，是组件边界的活样本。
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DSR_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Verify component isolation (core-only)
        # 关闭 io / runtime / entt 后只配置核心库：不查找 Threads、不编译加载器。
        run: >
          cmake -S . -B build-core-only -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DSR_BUILD_IO=OFF -DSR_BUILD_RUNTIME=OFF -DSR_ENABLE_ENTT=OFF
          -DSR_BUILD_EXAMPLES=OFF -DSR_BUILD_PRACTICE=OFF -DSR_BUILD_TESTS=OFF

      - name: Run Unit Tests
        # --parallel 必需：gtest_discover_tests 把每个用例注册为独立 ctest 项，
        # 179 用例 = 179 次进程启动。串行实测约 40 秒，并行降到 ~15 秒，
        # 而测试本身单进程只需 ~30 毫秒 —— 开销全在进程创建。
        #
        # -LE fast 排除 unit_tests_all：那是给本地开发用的单进程冒烟项
        # （ctest -L fast，0.4 秒），在 CI 里会把全部用例再跑一遍，纯冗余。
        # CI 保留 discover 粒度是为了失败时能直接定位到单个用例名。
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure --parallel -LE fast

      - name: Verify platform guards
        shell: bash
        run: |
          # 回归断言：三个 realtime 示例无条件使用 Win32Window，而
          # platform/win32_window.h 整体包在 #ifdef _WIN32 内。
          # CMakeLists.txt 必须用 if(WIN32) 守卫整个 add_executable，
          # 否则非 Windows 平台编译必然失败。
          if [ "$RUNNER_OS" != "Windows" ]; then
            for t in stage03_sprite_anim stage08_shader_live stage10_shadow_live; do
              if [ -f "build/bin/$t" ]; then
                echo "::error::$t 不应在非 Windows 平台产出（if(WIN32) 守卫失效）"
                exit 1
              fi
            done
            echo "平台守卫生效：三个窗口示例已正确跳过"
          else
            for t in stage03_sprite_anim stage08_shader_live stage10_shadow_live; do
              if [ ! -f "build/bin/${{ matrix.build_type }}/$t.exe" ]; then
                echo "::error::Windows 上缺少 $t.exe"
                exit 1
              fi
            done
            echo "Windows 窗口目标齐备"
          fi

      - name: Run Stage Examples (smoke test)
        shell: bash
        run: |
          mkdir -p output
          if [ "$RUNNER_OS" == "Windows" ]; then
            BIN="build/bin/${{ matrix.build_type }}"
          else
            BIN="build/bin"
          fi
          # 只跑离屏示例。三个 realtime 目标会开窗并进入消息循环，在 CI 上会挂死。
          # demo_gltf / demo_pbr_material / demo_skinning 是自产自销的往返测试
          # （运行时先写 .gltf 到 output/ 再读回），不需外部资产。
          TARGETS="stage01_framebuffer stage02_sprite stage04_triangle stage05_transform
          stage06_depth stage07_texture stage08_shader stage09_clip stage10_shadow
          stage11_msaa stage12_pbr stage13_postprocess stage14_threaded
          demo_2d demo_gltf demo_pbr_material demo_ibl_pbr demo_skinning demo_stars
          practice_hello_2d"
          RAN=0
          for stage in $TARGETS; do
            # 先解析出可执行文件路径，再直接调用。
            # 旧写法 "$BIN/$stage" || "$BIN/$stage.exe" || true 末尾的 || true
            # 让本步骤**永远不会失败**，属典型的掩盖症状。
            if [ -x "$BIN/$stage" ]; then
              EXE="$BIN/$stage"
            elif [ -f "$BIN/$stage.exe" ]; then
              EXE="$BIN/$stage.exe"
            else
              # 目标缺失说明构建产物不完整（或 target 被误删），必须失败：
              # 旧实现只 warning + continue，加上末尾允许少量缺失，
              # 实际上把「示例没跑」伪装成了绿灯。
              echo "::error::未找到 $stage，构建产物缺失或 target 已失效"
              exit 1
            fi
            echo "Running $stage..."
            # 不加 || true：shell: bash 默认 -e，非零退出码会正常使步骤失败
            "$EXE"
            RAN=$((RAN + 1))
          done
          echo "共运行 $RAN 个离屏示例"
          # 名单固定为 20 个（示例总数减去三个窗口示例），必须全部跑到：
          # 允许少量缺失会把「平台守卫失效 / 目标被删」这类问题吞掉。
          if [ "$RAN" -ne 20 ]; then
            echo "::error::只运行了 $RAN 个示例，预期 20 个"
            exit 1
          fi

      - name: Run benchmark
        shell: bash
        # 只构建不运行的话，基准代码本身能不能跑、输出是否稳定都无人验证。
        # 本步骤不设性能阈值（不同 runner 硬件差异过大），但要求程序正常退出。
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            BIN="build/bin/${{ matrix.build_type }}"
          else
            BIN="build/bin"
          fi
          "$BIN/renderer_benchmark" || "$BIN/renderer_benchmark.exe"

      - name: Run stress probe
        shell: bash
        # 46 个高负载/敌意输入场景（渲染、后处理、2D、IO、线程、内存、损坏文件）。
        # 退出码即结果：failures=0 → 0；任何场景失败 → 1。
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            BIN="build/bin/${{ matrix.build_type }}"
          else
            BIN="build/bin"
          fi
          "$BIN/renderer_stress" || "$BIN/renderer_stress.exe"

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ matrix.os }}
          path: output/
          if-no-files-found: ignore

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Debug sanitizers
        run: >
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug
          -DSR_ENABLE_SANITIZERS=ON -DSR_BUILD_BENCHMARKS=ON
          -DSR_BUILD_EXAMPLES=OFF -DSR_BUILD_PRACTICE=OFF
      - name: Build tests and stress probe
        # baremetal_smoke 必须一起构建：它注册在 fast 标签，下面的 ctest 会发现它，
        # 缺产物会以 Not Run 失败。ASAN + operator new 熔断是零堆证明的双保险。
        run: cmake --build build-asan --parallel 2 --target unit_tests render_regression renderer_stress baremetal_smoke
      - name: Run stress probe under ASAN
        # 同一套敌意输入在 ASAN 下跑一遍：零法线/越界写这类问题
        # 在 Release 下只表现为“颜色不对”，在这里会直接报错。
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./build-asan/bin/renderer_stress --quick
      - name: Run ASAN and UBSAN tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-asan -C Debug -L 'fast|regression' --output-on-failure

  thread-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure independent ThreadSanitizer build
        # TSAN must not be combined with ASAN. Both library and tests are instrumented.
        run: >
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug
          -DSR_BUILD_EXAMPLES=OFF -DSR_BUILD_PRACTICE=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
      - name: Build tests
        run: cmake --build build-tsan --parallel 2 --target unit_tests
      - name: Run concurrent task tests
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: >
          ctest --test-dir build-tsan -C Debug --output-on-failure
          -R '^(ThreadFailures|ThreadPool|CommandBuffer|ResourceCache)\.'

  # ============================================================
  # 裸机/freestanding（ADR-007）：core 组件必须能在 -fno-exceptions -fno-rtti
  # 下构建与安装。两层验证：
  #   1. sr_freestanding_headers_check（随任何 GCC/Clang 构建编译）：
  #      core/math/render/resource/scene 公共头逐个无异常编译，新增
  #      throw/RTTI/线程依赖会在这一步失败；
  #   2. SR_NO_EXCEPTIONS=ON 消费流：io/runtime/tests 自动裁剪，
  #      安装产物只含 core/render/scene（+可选 entt）。
  # ============================================================
  baremetal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure baremetal (no exceptions / no RTTI)
        run: cmake -S . -B build-baremetal -DSR_NO_EXCEPTIONS=ON
      - name: Build core components and freestanding header gate
        run: cmake --build build-baremetal --parallel 2
      - name: Install core components
        run: cmake --install build-baremetal --prefix build-baremetal/install
      - name: Verify install tree
        run: |
          test -f build-baremetal/install/lib/cmake/SoftRenderer/SoftRendererConfig.cmake
          test -f build-baremetal/install/include/softrenderer/version.h
          ! ls build-baremetal/install/lib/libsoftrenderer_io* 2>/dev/null


  # ============================================================
  # 覆盖率（testing_rules.md：核心模块行覆盖率 ≥ 80%、分支 ≥ 60%，
  # 且「覆盖率报告纳入 CI」）
  #
  # 为何单独一个 job 而不并入上面的矩阵：
  #   1. 只需一个平台出数据（GCC 的 gcov 生态最成熟；OpenCppCoverage
  #      在 Windows 上配置复杂）
  #   2. --coverage 会显著拖慢编译，并入矩阵会让三个平台都变慢
  #   3. 与构建 job 并行，不在关键路径上
  #
  # 门禁策略：**首次只报告不设阈值**。
  # 在实测基线未知的情况下直接设 80% 门禁，极可能立即红灯，
  # 违反「禁止带红灯合并」而使 CI 失去意义。先把基线量出来写进
  # docs/changelog.md，下一轮再启用棘轮式门禁（不允许下降）。
  # ============================================================
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install lcov
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov

      - name: Configure with coverage instrumentation
        # --coverage = -fprofile-arcs -ftest-coverage；-O0 保证行映射准确。
        # 不开 SR_ENABLE_SANITIZERS：ASAN 与 gcov 同时开会相互干扰，
        # 且两者目标不同（一个查内存错误，一个量覆盖度）。
        run: >
          cmake -S . -B build-cov
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="--coverage -g -O0"
          -DSR_BUILD_EXAMPLES=OFF -DSR_BUILD_PRACTICE=OFF

      - name: Build test targets
        # 只构建测试目标与架构门禁，不构建示例（示例不参与覆盖率统计）
        run: cmake --build build-cov --parallel --target unit_tests render_regression public_headers_check namespace_sentinel

      - name: Run tests
        # 必须从仓库根目录运行：示例与回归测试的 output/ 依赖相对路径。
        # render_regression 的基准图走编译期注入的绝对路径，不受工作目录影响。
        run: |
          mkdir -p output
          ./build-cov/bin/unit_tests
          ./build-cov/bin/render_regression

      - name: Collect coverage
        # --ignore-errors 必需：lcov 2.x 对未使用、空数据、版本不一致等
        # 情形默认报错退出，而这些在 header-only 项目里很常见
        # （大量 inline 函数在某些编译单元里未实例化）。
        run: |
          lcov --capture --directory build-cov --output-file coverage.info \
               --ignore-errors mismatch,unused,empty,inconsistent,corrupt
          # 只统计自有代码：公共头 include/softrenderer 与私有实现 src/
          # （排除系统头、第三方库、测试代码本身、构建目录）
          lcov --extract coverage.info "${GITHUB_WORKSPACE}/include/softrenderer/*" \
               "${GITHUB_WORKSPACE}/src/*" \
               --output-file coverage-src.info \
               --ignore-errors mismatch,unused,empty,inconsistent
          echo "===== 覆盖率基线（include/softrenderer + src）====="
          lcov --summary coverage-src.info --ignore-errors mismatch,unused,empty
          genhtml coverage-src.info --output-directory coverage-report \
                  --ignore-errors mismatch,unused,empty,inconsistent,source

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
          if-no-files-found: warn
